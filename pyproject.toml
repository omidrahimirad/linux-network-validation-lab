[project]
name = "linux-network-validation-lab"
version = "0.1.0"
description = "Reproducible Linux network validation lab for connectivity, latency, packet-loss, throughput, and fault-injection testing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jinja2>=3.1.4",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
netlab = "netlab_validator.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.2",
    "types-pyyaml>=6.0.12.20240808",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab_validator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["netlab_validator"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: Docker Compose network lab tests that require a running Docker daemon",
]
