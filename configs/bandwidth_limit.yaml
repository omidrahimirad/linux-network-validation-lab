name: bandwidth_limit
description: Forwarding path with a router egress rate limit for throughput validation.
target:
  host: 172.31.0.10
  expected_hops:
    - 172.30.0.254
    - 172.31.0.10
fault:
  enabled: true
  interface: eth1
  bandwidth_mbit: 10
tests:
  ping:
    count: 5
    timeout_seconds: 2
  iperf3:
    duration_seconds: 5
  traceroute:
    max_hops: 5
thresholds:
  max_avg_latency_ms: 50
  max_packet_loss_percent: 1
  min_throughput_mbps: 5
  max_throughput_mbps: 15
  require_expected_hops: true
capture:
  enabled: false
  interface: eth0
  duration_seconds: 10
