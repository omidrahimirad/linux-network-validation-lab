name: latency_degradation
description: Forwarding path with injected one-way delay on the router egress toward the server network.
target:
  host: 172.31.0.10
  expected_hops:
    - 172.30.0.254
    - 172.31.0.10
fault:
  enabled: true
  interface: eth1
  delay_ms: 80
tests:
  ping:
    count: 5
    timeout_seconds: 3
  iperf3:
    duration_seconds: 3
  traceroute:
    max_hops: 5
thresholds:
  max_avg_latency_ms: 200
  max_packet_loss_percent: 0
  min_throughput_mbps: 50
  require_expected_hops: true
capture:
  enabled: false
  interface: eth0
  duration_seconds: 10
